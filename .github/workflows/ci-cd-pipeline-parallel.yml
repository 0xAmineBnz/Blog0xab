name: CI/CD Pipeline - Parallel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual re-run, e.g. after rotating a scanner token or to re-check a
  # dependency advisory without pushing an empty commit.
  workflow_dispatch:
  # Weekly re-scan of unchanged code: Snyk/Semgrep rules and CVE feeds
  # move even when the repo does not. Off the hour to dodge runner contention.
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs, but let push runs finish so their checks report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job pins `ubuntu-24.04` rather than `ubuntu-latest`. `ubuntu-latest`
# silently rolls to the next LTS (26.04 images already exist), which swaps the
# glibc/Node ABI and the whole preinstalled toolchain under a green pipeline.
# Runner-image upgrades are handled manually when GitHub announces deprecation.
jobs:
  # Verify dependency signatures and warm the npm cache for the Node jobs.
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    # `cache: npm` caches ~/.npm (verified tarballs), not node_modules —
    # node_modules is machine-specific (glibc/Node ABI, symlinks, optional
    # deps) and unsound to restore across runner images.
    #
    # This job runs first and every other Node job `needs:` it, so its post-job
    # save warms the cache before the parallel jobs restore it.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify signatures
      run: npm audit signatures

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Gitleaks reads PR commits and posts finding comments.
      security-events: write # SARIF upload to code scanning (Security tab).

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Secrets Scanning
      # The pinned action hardcodes redaction and verbose logging; it exposes no args input.
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  #v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

    - name: Upload Gitleaks Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: gitleaks-sarif
        path: results.sarif
        retention-days: 90

    # Centralized reporting: every scanner's SARIF lands in the repo's
    # Security > Code scanning tab, so alerts are deduplicated across runs
    # and triaged in one place instead of only living in build artifacts.
    - name: Upload Gitleaks results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4
      if: always()
      with:
        sarif_file: results.sarif
        category: gitleaks

  semgrep-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (Security tab).

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  #V7
      with:
        # Full patch version: bare `3.11` resolves to the newest 3.11.x in the
        # runner tool cache, which moves on GitHub's schedule, not ours.
        python-version: '3.11.15'

    # Pin the CLI version; a hashed requirements lock would also pin its
    # transitive dependencies.
    - name: Install semgrep
      run: pip install semgrep==1.172.0

    # --config=auto fetches rules from semgrep.dev at run time: non-hermetic by
    # design (the rule set moves without a diff here), so a green run is not
    # reproducible — the weekly `schedule:` exists to rescan against new rules.
    - name: Run semgrep scan
      run: semgrep scan --config=auto --error --severity=ERROR --sarif-output=semgrep-results.sarif

    - name: Upload Semgrep Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: semgrep-sarif
        path: semgrep-results.sarif
        retention-days: 90

    - name: Upload Semgrep results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4
      if: always()
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep

  snyk-sca:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (Security tab).

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    # Unconditional: `npm ci` builds node_modules from the lockfile, verifying
    # each tarball's integrity hash — a cold cache is slower, never different.
    - name: Install dependencies
      run: npm ci

    - name: Run Snyk
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 #v1
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --fail-on=upgradable --sarif-file-output=snyk-results.sarif

    - name: Upload Snyk Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: snyk-sarif
        path: snyk-results.sarif
        retention-days: 90

    - name: Upload Snyk results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4
      if: always()
      with:
        sarif_file: snyk-results.sarif
        category: snyk

  # GitHub's own static analysis: deep dataflow queries over the JS/TS source.
  # `analyze` uploads its SARIF to code scanning automatically (default
  # `upload: true`), so no separate upload step or artifact is needed.
  codeql-sast:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (Security tab).

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d #v4
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d #v4
      with:
        category: "/language:javascript-typescript"

  # Audit this repository's own GitHub Actions workflows (injection sinks,
  # over-privileged jobs, unpinned actions, ...). `advanced-security: true`
  # (the default) uploads the SARIF to code scanning itself, so findings are
  # centralized in the Security tab like every other scanner here.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning (Security tab).

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 #v0.6.4
      with:
        advanced-security: false
        # Pin the zizmor CLI: the action's default (`latest`) moves on
        # upstream releases, breaking reproducibility of a green run.
        version: 1.30.1

  # Build alongside scans; ci-gate waits for all required jobs.
  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Check
      run: npm run typecheck

    - name: Run Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      env:
        SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "false"
      with:
        path: .
        format: cyclonedx-json
        output-file: all-dependencies-sbom.cdx.json
        # Use the next step for explicit retention; this workflow does not publish releases.
        upload-artifact: false
        upload-release-assets: false

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      with:
        name: all-dependencies-sbom
        path: all-dependencies-sbom.cdx.json
        retention-days: 90
        if-no-files-found: error



  # The single required status check (named by .github/rulesets/main.json), so
  # the job list above can be renamed, split or reordered without an admin
  # editing repo settings — the fan-in is versioned here, visible in the diff.
  #
  # `if: always()` is required: the default `success()` condition would skip
  # this job whenever an upstream job fails, and a required check that never
  # reports leaves PRs stuck on "expected — waiting for status". A `skipped`
  # result failing here is deliberate: no upstream job carries an `if:`, so a
  # skip means the run was cancelled or a job never started, not a no-op. If a
  # conditional job is added later, relax this for that job only.
  ci-gate:
    if: always()
    needs: [setup, secrets-scan, semgrep-sast, snyk-sca, codeql-sast, zizmor, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
    - name: Assert every upstream job succeeded
      env:
        # toJSON(needs) => {"<job-id>": {"result": "...", "outputs": {...}}, ...}
        # Passed via env rather than interpolated into the script body, so a
        # job name can never be parsed as shell.
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
        echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
