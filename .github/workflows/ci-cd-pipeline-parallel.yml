name: CI/CD Pipeline - Parallel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual re-run, e.g. after rotating a scanner token or to re-check a
  # dependency advisory without pushing an empty commit.
  workflow_dispatch:
  # Weekly re-scan of unchanged code: Snyk/Semgrep rules and CVE feeds
  # move even when the repo does not. Off the hour to dodge runner contention.
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs, but let push runs finish so their checks report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job pins `ubuntu-24.04` rather than `ubuntu-latest`. `ubuntu-latest`
# silently rolls to the next LTS (26.04 images already exist), which swaps the
# glibc/Node ABI and the whole preinstalled toolchain under a green pipeline.
# Nothing bumps a `runs-on` label automatically — Dependabot only touches
# `uses:` — so this is a manual bump when GitHub announces the deprecation.
jobs:
  # Verify dependency signatures and warm the npm cache for the Node jobs.
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    # `cache: npm` caches ~/.npm (npm's content-addressed tarball store), not
    # node_modules. node_modules is machine-specific — native addons compiled
    # against a given glibc/Node ABI, symlinks, platform-conditional optional
    # deps — so restoring it across runner images is unsound. ~/.npm is just
    # verified tarballs, portable anywhere. setup-node keys it on the platform,
    # arch and lockfile hash, and saves it in a post-job step.
    #
    # This job runs first and every other Node job `needs:` it, so its post-job
    # save warms the cache before the parallel jobs restore it.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify signatures
      run: npm audit signatures

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # Gitleaks reads PR commits and posts finding comments.

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Secrets Scanning
      # The pinned action hardcodes redaction and verbose logging; it exposes no args input.
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  #v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

    - name: Upload Gitleaks Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: gitleaks-sarif
        path: results.sarif
        retention-days: 90

  semgrep-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  #V7
      with:
        # Full patch version: bare `3.11` resolves to the newest 3.11.x in the
        # runner tool cache, which moves on GitHub's schedule, not ours.
        python-version: '3.11.15'

    # Pin the CLI version; a hashed requirements lock would also pin its
    # transitive dependencies.
    - name: Install semgrep
      run: pip install semgrep==1.172.0

    # NOTE: --config=auto fetches rules from semgrep.dev at run time, so this
    # step is deliberately non-hermetic: the rule set moves without a diff here.
    # That is what we want from a scanner (see the weekly `schedule:` above),
    # but it means a green run is not reproducible. Never gate an artifact on it.
    - name: Run semgrep scan
      run: semgrep scan --config=auto --error --severity=ERROR --sarif-output=semgrep-results.sarif

    - name: Upload Semgrep Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: semgrep-sarif
        path: semgrep-results.sarif
        retention-days: 90

  snyk-sca:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    # Unconditional. `npm ci` is authoritative — it builds node_modules from the
    # lockfile, verifying each tarball's integrity hash; ~/.npm only decides
    # whether the bytes come off disk or the network. A cold cache is slower,
    # never different. This replaces a restore + `if: cache-hit != 'true'`
    # fallback, a branch that only existed because node_modules was the cached
    # unit and therefore might arrive wrong or not at all.
    - name: Install dependencies
      run: npm ci

    - name: Run Snyk
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 #v1
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --fail-on=upgradable --sarif-file-output=snyk-results.sarif

    - name: Upload Snyk Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      if: always()
      with:
        name: snyk-sarif
        path: snyk-results.sarif
        retention-days: 90

  # Build alongside scans; ci-gate waits for all required jobs.
  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
      with:
        # Keep Node.js consistent across dependency, scan and build jobs.
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Check
      run: npm run typecheck

    - name: Run Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Generate SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
      env:
        SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
      with:
        path: .
        format: cyclonedx-json
        output-file: all-dependencies-sbom.cdx.json
        # Use the next step for explicit retention; this workflow does not publish releases.
        upload-artifact: false
        upload-release-assets: false

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
      with:
        name: all-dependencies-sbom
        path: all-dependencies-sbom.cdx.json
        retention-days: 90
        if-no-files-found: error



  # The single required status check. Branch protection (see
  # .github/rulesets/main.json) names THIS job and nothing else, so the job
  # list above can be renamed, split or reordered without an admin editing repo
  # settings — the fan-in is versioned here, visible in the diff.
  #
  # `if: always()` is what makes it a gate rather than decoration. Without it
  # the job inherits the default `success()` condition and is SKIPPED the
  # moment an upstream job fails — and a required check that never reports
  # leaves the PR "expected — waiting for status", which is precisely the state
  # people click past. So: always run, then assert on the collected results.
  #
  # `skipped` counts as failure here on purpose. No upstream job carries an
  # `if:`, so a skip means the run was cancelled or a job never started, not a
  # deliberate no-op. If you later add a conditional job, relax this to
  # `.result == "success" or .result == "skipped"` for that job only.
  ci-gate:
    if: always()
    needs: [setup, secrets-scan, semgrep-sast, snyk-sca, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
    - name: Assert every upstream job succeeded
      env:
        # toJSON(needs) => {"<job-id>": {"result": "...", "outputs": {...}}, ...}
        # Passed via env rather than interpolated into the script body, so a
        # job name can never be parsed as shell.
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
        echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
