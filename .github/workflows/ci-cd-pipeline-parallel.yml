name: CI/CD Pipeline - Parallel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'  # Mondays 06:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify signatures
      run: npm audit signatures

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Secrets Scanning
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  #v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

    - name: Upload Gitleaks Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: always()
      with:
        name: gitleaks-sarif
        path: results.sarif
        retention-days: 90

    - name: Upload Gitleaks results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      if: always()
      with:
        sarif_file: results.sarif
        category: gitleaks

  semgrep-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
      with:
        python-version: '3.11.15'

    - name: Install semgrep
      run: pip install semgrep==1.172.0

    - name: Run semgrep scan
      run: semgrep scan --config=auto --error --severity=ERROR --sarif-output=semgrep-results.sarif

    - name: Upload Semgrep Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: always()
      with:
        name: semgrep-sarif
        path: semgrep-results.sarif
        retention-days: 90

    - name: Upload Semgrep results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      if: always()
      with:
        sarif_file: semgrep-results.sarif
        category: semgrep

  snyk-sca:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Snyk
      uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 #v1
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --fail-on=upgradable --sarif-file-output=snyk-results.sarif

    - name: Upload Snyk Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: always()
      with:
        name: snyk-sarif
        path: snyk-results.sarif
        retention-days: 90

    - name: Upload Snyk results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      if: always()
      with:
        sarif_file: snyk-results.sarif
        category: snyk

  codeql-sast:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      with:
        category: "/language:javascript-typescript"

  zizmor-report-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 #v0.6.4
      with:
        version: 1.30.1

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 #v0.6.4
      with:
        version: 1.30.1
        advanced-security: false

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
      with:
        node-version: '24.21.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Check
      run: npm run typecheck

    - name: Run Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
      env:
        SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "false"
      with:
        path: .
        format: cyclonedx-json
        output-file: all-dependencies-sbom.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: all-dependencies-sbom
        path: all-dependencies-sbom.cdx.json
        retention-days: 90
        if-no-files-found: error

  docker-image:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    outputs:
      version: ${{ steps.image.outputs.version }}
      latest: ${{ steps.image.outputs.latest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 #v6
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 #v4.1.0

    - name: Compute image reference
      id: image
      env:
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        name="ghcr.io/${REPO,,}"
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "version=$name:sha-$SHA" >> "$GITHUB_OUTPUT"
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          echo "latest=$name:latest" >> "$GITHUB_OUTPUT"
        fi

    - name: Build image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf #v7.2.0
      with:
        context: .
        load: true
        tags: ${{ steps.image.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Export image
      env:
        VERSION: ${{ steps.image.outputs.version }}
      run: docker save "$VERSION" -o image.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      with:
        name: image
        path: image.tar
        retention-days: 1
        if-no-files-found: error

    - name: Run Trivy on the image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.version }}
        scanners: vuln
        format: sarif
        output: trivy-results.sarif
        exit-code: '1'
        severity: HIGH,CRITICAL

    - name: Upload Trivy Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
      if: always()
      with:
        name: trivy-sarif
        path: trivy-results.sarif
        retention-days: 90

    - name: Upload Trivy results to code scanning
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d #v4.38.3
      if: always()
      with:
        sarif_file: trivy-results.sarif
        category: trivy

  docker-publish:
    needs: docker-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
    - name: Download image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
      with:
        name: image

    - name: Load image
      run: docker load -i image.tar

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push image to GHCR
      env:
        VERSION: ${{ needs.docker-image.outputs.version }}
        LATEST: ${{ needs.docker-image.outputs.latest }}
      run: |
        docker push "$VERSION"
        if [ -n "$LATEST" ]; then
          docker tag "$VERSION" "$LATEST"
          docker push "$LATEST"
        fi

  ci-gate:
    if: always()
    needs: [setup, secrets-scan, semgrep-sast, snyk-sca, codeql-sast, zizmor, build, docker-image, docker-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
    - name: Assert every upstream job succeeded
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
        echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or (.key == "docker-publish" and .result == "skipped"))' > /dev/null
