<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cyberblog · palette explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      :root {
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      html { color-scheme: dark; }
      body {
        margin: 0;
        background: #050505;
        color: #cfcfcf;
        font-family: var(--mono);
        font-size: 15px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        padding: 56px 28px 96px;
      }
      .page-head {
        max-width: 1180px;
        margin: 0 auto 40px;
      }
      .page-head h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 6px;
        color: #e6e6e6;
        letter-spacing: -0.01em;
      }
      .page-head h1 .sigil { color: #4a4a4a; }
      .page-head p {
        margin: 0;
        max-width: 70ch;
        color: #7a7a7a;
        font-size: 0.86rem;
      }
      .grid {
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 26px;
      }

      /* ── a single palette card ─────────────────────────────────────────── */
      .card {
        background: var(--background);
        border: 1px solid var(--border-strong);
      }
      .card ::selection { background: var(--accent); color: var(--background); }

      .label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .label .name {
        color: var(--accent);
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: 0.02em;
      }
      .label .idx {
        color: var(--muted-2);
        font-size: 0.7rem;
      }

      /* masthead band — mirrors the site header contrast treatment */
      .masthead {
        background: var(--surface);
        border-bottom: 1px solid var(--border-strong);
        padding: 16px 16px 13px;
      }
      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--heading);
      }
      .brand .dot { color: var(--muted-2); }
      .roles {
        margin: 7px 0 0;
        font-size: 0.74rem;
        color: var(--muted);
      }
      .roles .c { color: var(--muted-2); }
      .nav {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.76rem;
        color: var(--muted-2);
        align-items: center;
      }
      .nav a { color: var(--link); text-decoration: none; }
      .nav .kbd {
        border: 1px solid var(--border);
        padding: 0 5px;
        font-size: 0.62rem;
        color: var(--muted-2);
      }

      .body { padding: 16px 16px 18px; }
      .cmd {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--heading);
        margin: 0;
      }
      .cmd .p { color: var(--muted-2); }
      .rule {
        height: 0;
        border: 0;
        border-top: 1px dashed var(--border-strong);
        margin: 13px 0;
      }
      .post-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
      }
      .post-title a { color: var(--link); text-decoration: none; }
      .meta {
        margin: 5px 0 0;
        font-size: 0.72rem;
        color: var(--muted-2);
        font-variant-numeric: tabular-nums;
      }
      .meta .cat { color: var(--muted); }
      .excerpt {
        margin: 9px 0 0;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .more {
        display: inline-block;
        margin-top: 9px;
        font-size: 0.8rem;
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(in oklab, var(--link) 45%, transparent);
      }

      /* code block with faux syntax highlight on each palette */
      pre.code {
        margin: 15px 0 0;
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 11px 12px;
        font-size: 0.74rem;
        line-height: 1.65;
        overflow-x: auto;
      }
      .code .cm { color: var(--muted); font-style: italic; }
      .code .kw { color: var(--accent); }
      .code .fn { color: var(--link); }
      .code .st { color: color-mix(in oklab, var(--accent) 62%, var(--foreground)); }
      .code .nu { color: var(--warning); }
      .code .pl { color: var(--foreground); }
      .inline {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 0.05em 0.35em;
        color: color-mix(in oklab, var(--accent) 60%, var(--foreground));
        font-size: 0.78rem;
      }

      /* swatch strip */
      .swatches {
        display: flex;
        border-top: 1px solid var(--border);
      }
      .swatches .sw {
        flex: 1;
        height: 30px;
        position: relative;
      }
      .swatches .sw span {
        position: absolute;
        inset: auto 0 -17px 0;
        text-align: center;
        font-size: 0.55rem;
        color: var(--muted-2);
        letter-spacing: 0.02em;
      }
      .swfoot { padding: 0 16px 16px; }
      .hexrow {
        margin-top: 26px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 0.64rem;
        color: var(--muted-2);
      }
      .hexrow b { color: var(--muted); font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="page-head">
      <h1><span class="sigil">./</span>palette explorer</h1>
      <p>
        Five takes on the same terminal blueprint — dark canvas, one dominant
        accent (headings · prompts · markers · selection), one link hue, neutral
        grays, danger/warning. Drop-in token blocks live in
        <code>design/palettes.css</code>. Card 0 is the current theme.
      </p>
    </div>
    <div class="grid" id="grid"></div>

    <script>
      const PALETTES = [
        {
          name: "neon green · current",
          t: {
            background: "#0a0a0a", surface: "#0f0f0f", foreground: "#d4d4d4",
            muted: "#8a8a8a", "muted-2": "#5e5e5e", border: "#232323",
            "border-strong": "#333333", accent: "#b8ff5a", heading: "#b8ff5a",
            link: "#55b7ff", danger: "#ff6b6b", warning: "#ffcf6b",
          },
        },
        {
          name: "amber phosphor",
          t: {
            background: "#0a0806", surface: "#130d07", foreground: "#ddcfb0",
            muted: "#9c8b66", "muted-2": "#6a5c40", border: "#2a2013",
            "border-strong": "#3b2e1b", accent: "#ffb454", heading: "#ffb454",
            link: "#5fb8d6", danger: "#ff6f5e", warning: "#ffd27a",
          },
        },
        {
          name: "ice",
          t: {
            background: "#070a0c", surface: "#0c1116", foreground: "#ccd8e0",
            muted: "#7e8c96", "muted-2": "#4f5a63", border: "#1b2228",
            "border-strong": "#2a333b", accent: "#4fd6ff", heading: "#4fd6ff",
            link: "#9d8bff", danger: "#ff6b8a", warning: "#ffcf6b",
          },
        },
        {
          name: "synthwave",
          t: {
            background: "#0b0711", surface: "#130b1b", foreground: "#e2d6ea",
            muted: "#97889f", "muted-2": "#645869", border: "#261a30",
            "border-strong": "#392843", accent: "#ff5cf0", heading: "#ff5cf0",
            link: "#4fe3ff", danger: "#ff5a6e", warning: "#ffc861",
          },
        },
        {
          name: "mono matrix",
          t: {
            background: "#060806", surface: "#0b0f0b", foreground: "#b6cbae",
            muted: "#6f8267", "muted-2": "#46523f", border: "#172016",
            "border-strong": "#263123", accent: "#57f78e", heading: "#57f78e",
            link: "#a6e3ad", danger: "#ff7a6b", warning: "#e6d56b",
          },
        },
      ];

      const SW = ["background", "surface", "accent", "link", "muted", "warning"];

      function card(p, i) {
        const vars = Object.entries(p.t)
          .map(([k, v]) => `--${k}:${v}`)
          .join(";");
        const swatches = SW.map(
          (k) => `<div class="sw" style="background:${p.t[k]}"><span>${k}</span></div>`
        ).join("");
        const hex = ["accent", "link", "background", "foreground", "warning", "danger"]
          .map((k) => `<span><b>${k}</b> ${p.t[k]}</span>`)
          .join("");
        return `
        <div class="card" style="${vars}">
          <div class="label"><span class="name">${p.name}</span><span class="idx">palette ${i}</span></div>
          <div class="masthead">
            <div class="brand"><span class="dot">./</span>0xYF</div>
            <p class="roles"><span class="c">// </span>security researcher&nbsp;&nbsp;·&nbsp;&nbsp;reverse engineer&nbsp;&nbsp;·&nbsp;&nbsp;exploit developer</p>
            <div class="nav">
              [<a href="#">blog</a>] [<a href="#">about</a>] [<a href="#">rss</a>]
              <span>[<a href="#">search</a>]</span><span class="kbd">/</span>
            </div>
          </div>
          <div class="body">
            <p class="cmd"><span class="p">$ </span>ls ./posts</p>
            <hr class="rule" />
            <p class="post-title"><a href="#">Heap grooming a one-byte overflow into RCE</a></p>
            <p class="meta">2026-05-18 &nbsp;·&nbsp; <span class="cat">PWN</span> &nbsp;·&nbsp; 11 min read</p>
            <p class="excerpt">Turning an off-by-one in <span class="inline">tcache</span> into a controlled write, then a clean shell — minimal PoC, annotated.</p>
            <a class="more" href="#">Read More →</a>
            <pre class="code"><span class="cm"># leak a libc pointer</span>
<span class="kw">def</span> <span class="fn">leak</span>(io, idx):
    io.<span class="fn">send</span>(<span class="st">b"show %d"</span> % idx)
    <span class="kw">return</span> <span class="fn">u64</span>(io.<span class="fn">recv</span>(<span class="nu">6</span>).<span class="fn">ljust</span>(<span class="nu">8</span>, <span class="st">b"\x00"</span>))</pre>
          </div>
          <div class="swatches">${swatches}</div>
          <div class="swfoot"><div class="hexrow">${hex}</div></div>
        </div>`;
      }

      document.getElementById("grid").innerHTML = PALETTES.map(card).join("");
    </script>
  </body>
</html>
